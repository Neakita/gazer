[package]
name = "gazer"
version = "0.1.0"
edition = "2024"

[dependencies]
ashpd = { version = "0.14.0", features = ["screencast"] }
burn = { version = "0.22.1", features = ["wgpu"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["file", "image"] }
evdev = "0.13.2"
garb = "0.2.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }
itertools = "0.15.0"
pipewire = "0.10.1"
snafu = "0.9.2"
tokio = { version = "1.54.1", features = ["full", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
